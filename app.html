<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>파라써블 · CodeZero 코칭 — 앱·기기·보이스 연동</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --lg:#A50034;--ink:#14161a;--ink2:#464c55;--mut:#8b929c;--line:#e7e9ec;--line2:#f1f3f5;--bg:#eef0f2;
 --g:#1f9d57;--a:#d08a1e;--r:#e0455f;
 --gs:#e7f5ec;--as:#fbf1de;--rs:#fce8eb;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Malgun Gothic",sans-serif;
 background:
  radial-gradient(1200px 620px at 20% -8%,#f7f8f9,transparent 60%),
  radial-gradient(900px 620px at 98% 6%,#e9ebee,transparent 62%),
  linear-gradient(180deg,#f2f4f6,#e7eaed);
 color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:1560px;margin:0 auto;padding:18px 26px 44px}

/* ── 상단 바 ── */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:19px;font-weight:800;letter-spacing:-.03em}h1 b{color:var(--lg)}
.tsub{font-size:12.5px;color:var(--mut);margin-top:3px}
.goback{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;
 padding:11px 18px;border-radius:99px;background:var(--lg);color:#fff;border:1px solid var(--lg);
 text-decoration:none;letter-spacing:-.015em;transition:.15s;white-space:nowrap}
.goback:hover{filter:brightness(1.08)}
.keys{margin-left:auto;font-size:11.5px;color:var(--mut);border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 14px}
.keys b{color:var(--ink2);font-weight:700}

/* ── 데모 컨트롤 ── */
.demo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);
 border-radius:16px;padding:12px 16px;margin-bottom:22px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.demo .dl{font-size:11px;font-weight:800;color:var(--mut);letter-spacing:.02em;text-transform:uppercase;margin-right:2px}
.spacer{flex:1 1 20px}
.sld{display:flex;align-items:center;gap:10px}
.sld input[type=range]{width:200px;accent-color:var(--lg)}
.sld .val{font-size:14px;font-weight:800;min-width:44px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-size:12.5px;
 font-weight:700;color:var(--ink2);cursor:pointer;transition:.14s;white-space:nowrap}
.btn:hover{border-color:#cdd2d8}
.btn.pri{background:var(--lg);color:#fff;border-color:var(--lg)}

/* ── 스테이지 ── */
.stage{display:flex;gap:52px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 0}

/* ── 폰 ── */
.phone{position:relative;width:352px;height:730px;border-radius:52px;
 background:linear-gradient(160deg,#20242a,#0e1013);padding:13px;
 box-shadow:0 40px 90px -30px rgba(20,22,26,.55),0 0 0 2px #2a2f36,inset 0 0 0 1.5px rgba(255,255,255,.05);flex:0 0 auto}
.phone::after{content:"";position:absolute;top:18px;left:50%;transform:translateX(-50%);
 width:118px;height:30px;background:#0b0d10;border-radius:0 0 18px 18px;z-index:6}
.scrn{position:relative;width:100%;height:100%;border-radius:40px;overflow:hidden;background:#fbfbfc;display:flex;flex-direction:column}
.stat{height:44px;flex:0 0 44px;display:flex;align-items:flex-end;justify-content:space-between;
 padding:0 24px 7px;font-size:13px;font-weight:700;color:var(--ink);z-index:5}
.stat .rt{display:flex;gap:6px;align-items:center;font-size:12px}
.app{flex:1 1 auto;overflow-y:auto;overflow-x:hidden}
.app::-webkit-scrollbar{width:0}

/* 앱 헤더 */
.ahead{padding:6px 22px 10px;display:flex;align-items:center;gap:11px}
.ahead .logo{font-size:16px;font-weight:800;letter-spacing:-.02em}
.ahead .logo b{color:var(--lg)}
.conn{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--g)}
.conn .dot{width:7px;height:7px;border-radius:99px;background:var(--g);box-shadow:0 0 0 3px #1f9d5722}

/* ── 위저드 ── */
.wiz{padding:2px 18px 20px}
.steps{display:flex;align-items:center;gap:6px;margin:2px 0 16px}
.steps .s{flex:1;height:4px;border-radius:99px;background:var(--line)}
.steps .s.on{background:var(--lg)}
.steps .s.done{background:#e29ab3}
.wtitle{font-size:20px;font-weight:800;letter-spacing:-.03em;margin-bottom:3px}
.wsub{font-size:12.5px;color:var(--mut);font-weight:600;line-height:1.5;margin-bottom:16px}
.wtag{font-size:11px;font-weight:800;color:var(--lg);letter-spacing:.03em}

/* 모델 카드 */
.mcard{display:flex;align-items:center;gap:13px;border:1.5px solid var(--line);border-radius:16px;
 padding:14px;margin-bottom:10px;cursor:pointer;transition:.14s;background:#fff}
.mcard:hover{border-color:#cdd2d8}
.mcard.on{border-color:var(--lg);background:#fdf5f7;box-shadow:0 0 0 3px #a5003415}
.mcard .mi{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;flex:0 0 auto;
 font-size:15px;font-weight:800;color:#fff}
.mcard .mt{flex:1}
.mcard .mt .a{font-size:14.5px;font-weight:800}
.mcard .mt .a em{font-style:normal;color:var(--lg);margin-right:6px}
.mcard .mt .b{font-size:11.5px;color:var(--mut);font-weight:600;margin-top:2px}
.mcard .chk{width:22px;height:22px;border-radius:99px;border:2px solid var(--line);flex:0 0 auto;transition:.14s;position:relative}
.mcard.on .chk{border-color:var(--lg);background:var(--lg)}
.mcard.on .chk::after{content:"";position:absolute;left:6px;top:2.5px;width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}

/* 서브타입 토글 */
.subtog{display:flex;gap:8px;margin:12px 0 2px}
.subtog button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:11px;cursor:pointer;transition:.14s;text-align:left}
.subtog button.on{border-color:var(--lg);background:#fdf5f7}
.subtog button b{font-size:12.5px;font-weight:800;display:block}
.subtog button small{font-size:10.5px;color:var(--mut);font-weight:600}

/* 매개변수 필드 */
.pfield{margin-top:18px}
.pfield .pl{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:800}
.pfield .pl .pv{font-size:15px;color:var(--lg);font-weight:800}
.pfield .pl .pv small{font-size:11px;color:var(--mut);font-weight:700}
.pfield input[type=range]{width:100%;accent-color:var(--lg);margin-top:11px}
.pfield .ticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut);font-weight:700;margin-top:3px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.chip-t{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:9px 13px;font-size:12px;
 font-weight:700;color:var(--ink2);cursor:pointer;transition:.14s}
.chip-t.on{border-color:var(--lg);background:#fdf5f7;color:var(--lg)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:11px}
.seg button{flex:1;border:0;background:#fff;padding:11px 6px;font-size:12px;font-weight:700;color:var(--mut);cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--lg);color:#fff}
.derived{background:var(--line2);border-radius:14px;padding:13px 15px;margin-top:18px;display:flex;gap:8px}
.derived .d{flex:1;text-align:center}
.derived .d .k{font-size:10.5px;color:var(--mut);font-weight:700}
.derived .d .v{font-size:16px;font-weight:800;margin-top:3px}
.derived .d .v em{font-size:11px;font-style:normal;color:var(--mut);font-weight:700}

/* 보이스 카드 */
.vcard{display:flex;align-items:center;gap:13px;border:1.5px solid var(--line);border-radius:16px;
 padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:.14s;background:#fff;position:relative;overflow:hidden}
.vcard.on{border-color:var(--lg);background:#fdf5f7}
.vcard .av{width:46px;height:46px;border-radius:99px;flex:0 0 auto;display:grid;place-items:center;
 color:#fff;font-size:20px;box-shadow:inset 0 -6px 14px rgba(0,0,0,.12)}
.vcard .vt{flex:1}
.vcard .vt .a{font-size:14.5px;font-weight:800}
.vcard .vt .b{font-size:11.5px;color:var(--mut);font-weight:600;margin-top:2px}
.vcard .play{width:34px;height:34px;border-radius:99px;border:1.5px solid var(--line);background:#fff;
 display:grid;place-items:center;flex:0 0 auto;cursor:pointer;color:var(--lg);font-size:12px}
.vcard.on .play{border-color:var(--lg);background:var(--lg);color:#fff}
.vnote{font-size:11px;color:var(--mut);font-weight:600;line-height:1.5;background:var(--as);border-radius:11px;padding:11px 13px;margin-top:6px}
.vnote b{color:#b5750f}

.wnav{display:flex;gap:10px;margin-top:20px}
.wnav button{flex:1;border-radius:15px;padding:15px;font-size:14.5px;font-weight:800;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink2);transition:.14s}
.wnav button.next{flex:2;background:var(--lg);color:#fff;border-color:var(--lg)}
.wnav button.next:disabled{opacity:.4;cursor:not-allowed}

/* ── 동작 화면 ── */
.op{display:none;padding:2px 18px 22px}
.op.on{display:block}
.hero{position:relative;border-radius:24px;padding:20px;overflow:hidden;color:#fff;box-shadow:0 18px 34px -18px rgba(20,22,26,.42)}
.hero .htop{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;opacity:.94}
.hero .htop .badge{background:rgba(255,255,255,.2);border-radius:99px;padding:4px 10px}
.ringrow{display:flex;align-items:center;gap:18px;margin:14px 0 4px}
.ring{position:relative;width:112px;height:112px;flex:0 0 auto}
.ring .pc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .pc b{font-size:29px;font-weight:800;letter-spacing:-.03em;line-height:1}
.ring .pc span{font-size:10.5px;font-weight:700;opacity:.85;margin-top:3px}
.hmsg{flex:1}
.hmsg .vd{font-size:23px;font-weight:800;letter-spacing:-.03em}
.hmsg .ln{font-size:13.5px;font-weight:600;line-height:1.5;margin-top:7px;opacity:.97;white-space:pre-line}
.hstat{display:flex;gap:8px;margin-top:15px}
.hstat .c{flex:1;background:rgba(255,255,255,.16);border-radius:13px;padding:9px 11px}
.hstat .c .k{font-size:10px;font-weight:700;opacity:.85}
.hstat .c .v{font-size:16px;font-weight:800;margin-top:2px}
.hstat .c .v em{font-size:10.5px;font-style:normal;font-weight:700;opacity:.85;margin-left:1px}

/* 보이스 재생 바 */
.voicebar{display:flex;align-items:center;gap:11px;background:#111417;border-radius:16px;padding:12px 14px;margin-top:12px}
.voicebar .av{width:38px;height:38px;border-radius:99px;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:17px}
.voicebar .vinfo{flex:1;min-width:0}
.voicebar .vinfo .nm{font-size:11px;font-weight:800;color:#cfd5db}
.voicebar .vinfo .ln{font-size:12.5px;font-weight:600;color:#fff;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq{display:flex;align-items:flex-end;gap:2.5px;height:22px;flex:0 0 auto}
.eq i{width:3px;background:#7ee2a8;border-radius:2px;height:5px}
.eq.spk i{animation:eqb .7s infinite ease-in-out}
.eq.spk i:nth-child(2){animation-delay:.1s}.eq.spk i:nth-child(3){animation-delay:.25s}.eq.spk i:nth-child(4){animation-delay:.15s}.eq.spk i:nth-child(5){animation-delay:.3s}
@keyframes eqb{0%,100%{height:5px}50%{height:20px}}
.voicebar.muted{background:#20242a}
.voicebar.muted .vinfo .ln{color:#9aa3ab}

/* CTA */
.cta{margin-top:13px;display:flex;flex-direction:column;gap:9px}
.big{width:100%;border:0;border-radius:15px;padding:16px;font-size:15px;font-weight:800;letter-spacing:-.02em;
 cursor:pointer;transition:.14s;display:flex;align-items:center;justify-content:center;gap:8px}
.big:active{transform:translateY(1px)}
.big.gr{background:var(--g);color:#fff}.big.am{background:var(--a);color:#fff}.big.rd{background:var(--r);color:#fff}
.sub{width:100%;border:1px solid var(--line);background:#fff;border-radius:15px;padding:13px;font-size:13.5px;font-weight:700;color:var(--ink2);cursor:pointer;transition:.14s}
.sub:hover{border-color:#cdd2d8}

/* 카드 */
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px 16px;margin-top:13px}
.card .ct{font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
.card .ct .tag{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px}
.tag.g{background:var(--gs);color:var(--g)}.tag.a{background:var(--as);color:#b5750f}.tag.r{background:var(--rs);color:var(--r)}

/* 우선 구역 */
.zones{display:flex;gap:7px;margin-top:13px}
.zones .z{flex:1;border-radius:12px;padding:11px 6px;text-align:center;border:1.5px solid var(--line2);background:var(--line2);transition:.2s}
.zones .z .zi{font-size:19px}
.zones .z .zn{font-size:10.5px;font-weight:700;color:var(--ink2);margin-top:3px}
.zones .z.rec{border-color:#bfe6cd;background:#eef8f1}
.zones .z.done{border-color:var(--g);background:var(--g)}
.zones .z.done .zn{color:#fff}.zones .z.done .zi{filter:grayscale(1) brightness(3)}
.zones .z.skip{opacity:.4}
.znote{font-size:11.5px;color:var(--mut);font-weight:600;line-height:1.5;margin-top:11px}

/* 수명 코칭 */
.coach{background:linear-gradient(140deg,#fbeef2,#fff);border:1px solid #f0d9e0;border-radius:16px;padding:14px 15px;margin-top:13px}
.coach .ch{font-size:12.5px;font-weight:800;color:var(--lg);display:flex;align-items:center;gap:7px}
.coach .cb{font-size:12.5px;font-weight:600;line-height:1.55;margin-top:8px;color:var(--ink2)}
.coach .cb b{color:var(--ink);font-weight:800}

.opfoot{display:flex;gap:9px;margin-top:14px}
.opfoot button{flex:1;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px;font-size:12.5px;font-weight:700;color:var(--ink2);cursor:pointer}
.opfoot button:hover{border-color:#cdd2d8}

/* 토스트 */
.toast{position:absolute;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);
 background:#14161a;color:#fff;font-size:12.5px;font-weight:700;padding:11px 16px;border-radius:13px;
 opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;z-index:9;max-width:90%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── 연동 ── */
.link{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--mut);flex:0 0 auto}
.waves{display:flex;flex-direction:column;gap:5px;align-items:center}
.waves span{display:block;width:8px;height:8px;border-radius:99px;background:var(--lg);opacity:.25;animation:pulse 1.5s infinite}
.waves span:nth-child(2){animation-delay:.2s}.waves span:nth-child(3){animation-delay:.4s}.waves span:nth-child(4){animation-delay:.6s}
@keyframes pulse{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.link .lt{font-size:11px;font-weight:800;letter-spacing:.02em;writing-mode:vertical-rl;transform:rotate(180deg);color:var(--ink2)}

/* ── 기기 열 ── */
.devcol{display:flex;flex-direction:column;align-items:center;gap:26px;flex:0 0 auto}
.dev-name{font-size:12.5px;font-weight:800;color:var(--ink2);letter-spacing:-.01em;text-align:center}
.dev-name span{color:var(--lg)}
.dev-name small{display:block;font-size:10.5px;color:var(--mut);font-weight:600;margin-top:2px}

/* 스틱 청소기 */
.stick-wrap{display:flex;align-items:flex-end;gap:20px}
.stick{position:relative;width:150px;height:430px;flex:0 0 auto}
/* 거치대 */
.dock{position:absolute;right:6px;top:24px;bottom:0;width:20px;border-radius:12px;
 background:linear-gradient(180deg,#d6dade,#b4bbc1);box-shadow:0 12px 24px -12px rgba(0,0,0,.4)}
.dock::before{content:"";position:absolute;left:-9px;top:64px;width:30px;height:12px;border-radius:5px;background:#c2c8ce}
.dock::after{content:"";position:absolute;left:-16px;bottom:0;width:60px;height:14px;border-radius:8px 8px 12px 12px;background:linear-gradient(180deg,#cfd4d9,#a7aeb5)}
/* 손잡이 */
.sv-grip{position:absolute;left:20px;top:0;width:40px;height:96px;border-radius:22px 22px 8px 20px;
 background:linear-gradient(150deg,#3a4048,#1b1f24);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.05),0 8px 18px -8px rgba(0,0,0,.5)}
.sv-grip::after{content:"";position:absolute;left:9px;top:16px;width:8px;height:52px;border-radius:6px;background:rgba(255,255,255,.06)}
/* 트리거 */
.sv-trig{position:absolute;left:58px;top:70px;width:16px;height:26px;border-radius:0 8px 8px 0;background:linear-gradient(90deg,#2b3037,#171b1f)}
/* 본체 (모터+먼지통) + LCD */
.sv-body{position:absolute;left:8px;top:88px;width:118px;height:150px;border-radius:26px 30px 30px 26px;
 background:linear-gradient(135deg,#eef1f4,#cfd5db 60%,#b9c0c7);
 box-shadow:0 22px 40px -18px rgba(20,22,26,.45),inset 0 0 0 2px rgba(255,255,255,.5),inset 0 -12px 24px rgba(0,0,0,.08)}
.sv-bin{position:absolute;left:16px;top:104px;width:44px;height:120px;border-radius:20px;
 background:linear-gradient(120deg,rgba(190,210,225,.55),rgba(150,175,195,.35));border:1.5px solid rgba(255,255,255,.4)}
.lcd{position:absolute;left:44px;top:118px;width:96px;height:96px;border-radius:50%;overflow:hidden;
 background:#0d1014;box-shadow:inset 0 0 0 6px #171b21,inset 0 0 26px rgba(0,0,0,.7),0 6px 14px -6px rgba(0,0,0,.5);
 display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:.3s}
.lcd .glow{position:absolute;inset:0;transition:.35s}
.lcd .lbrand{position:relative;z-index:2;font-size:8.5px;font-weight:800;letter-spacing:.02em}
.lcd .lpct{position:relative;z-index:2;font-size:27px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-top:2px}
.lcd .lpct small{font-size:11px;font-weight:700;opacity:.8}
.lcd .lmode{position:relative;z-index:2;font-size:9px;font-weight:700;opacity:.85;margin-top:3px}
.lcd .lverd{position:relative;z-index:2;font-size:12.5px;font-weight:800;margin-top:4px}
/* 연장관 */
.sv-wand{position:absolute;left:56px;top:236px;width:20px;height:120px;border-radius:6px;
 background:linear-gradient(90deg,#c3cace,#eef1f3 45%,#aab2b8);box-shadow:0 6px 14px -8px rgba(0,0,0,.4)}
.sv-wand::after{content:"";position:absolute;left:7px;top:10px;width:6px;height:100px;border-radius:4px;background:rgba(255,255,255,.55)}
/* 바닥 헤드 */
.sv-head{position:absolute;left:14px;top:352px;width:132px;height:30px;border-radius:10px 10px 14px 14px;
 background:linear-gradient(180deg,#3a4048,#171b1f);box-shadow:0 14px 22px -12px rgba(0,0,0,.5)}
.sv-head::before{content:"";position:absolute;left:52px;top:-16px;width:26px;height:20px;border-radius:6px;
 background:linear-gradient(180deg,#c3cace,#9aa2a8);transform:rotate(0deg)}
.sv-head::after{content:"";position:absolute;left:8px;bottom:4px;right:8px;height:7px;border-radius:5px;
 background:repeating-linear-gradient(90deg,#4a5158 0 5px,#2b3036 5px 9px)}
.sv-led{position:absolute;left:26px;top:388px;width:104px;height:8px;border-radius:99px;transition:.3s;opacity:.9;filter:blur(1px)}

.dev-status{font-size:12px;font-weight:800;color:var(--ink2);display:flex;align-items:center;gap:8px}
.dev-status .d{width:8px;height:8px;border-radius:99px;background:var(--mut)}
.dev-status.run .d{background:var(--g);animation:blink 1s infinite}
.dev-status.chg .d{background:var(--a);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}

<script>
/* ══════════ 데이터 ══════════ */
const M={
'A-1':{name:'가끔·방치형',r:2.34,rb:2.34,k:1.0,req:8,meas:2.75,abort:7.5,axes:'F1·D1·M2·L0·C3',risk:'저SOC 장기 보관 → 자가방전 열화',coach:'2주 미사용 시 55% 보관 충전을 권장해요'},
'A-2':{name:'가끔·상시거치형',r:2.34,rb:2.34,k:1.0,req:8,meas:2.64,abort:0.0,axes:'F1·D1·M2·L0·C1',risk:'만충 상시 유지 → 고SOC 스트레스',coach:'만충 상시 유지는 셀 스트레스 · 80% 상한을 권장해요'},
'B-1':{name:'짧고 잦은 터보상시',r:4.59,rb:4.25,k:1.08,req:9,meas:5.37,abort:4.7,axes:'F2·D1·M3·L1·C2',risk:'고전류 방전 및 발열 누적',coach:'터보 8분 = 표준 15분, 모드 다이어트를 제안해요'},
'B-2':{name:'짧고 잦은 스팟터보',r:3.51,rb:3.25,k:1.08,req:8,meas:4.09,abort:1.0,axes:'F2·D1·M2→M3·L1·C2',risk:'특이 리스크 없음 (기준 그룹)',coach:'주간 배터리 효율 점수 리포트를 제공해요'},
'C-1':{name:'장시간 완주형',r:1.94,rb:1.94,k:1.0,req:33,meas:2.38,abort:50.0,axes:'F3·D3·M1·L0·C2',risk:'1회 방전 심도(DoD) 과다',coach:'종료 예상 잔량을 미리 표시 · DoD 70% 상한을 지켜요'},
'C-2':{name:'장시간 분할형',r:1.94,rb:1.94,k:1.0,req:22,meas:2.26,abort:0.4,axes:'F3·D2·M1·L0·C1',risk:'등가 사이클 카운트 급증',coach:'분할 2회=0.9사이클, 통합 1회=0.7사이클을 안내해요'},
'D-1':{name:'고빈도 다중세션형',r:5.0,rb:4.0,k:1.25,req:13,meas:6.26,abort:84.4,axes:'F3·D2·M3·L2·C2',risk:'완주 불가 + 급속충전 발열',coach:'급속충전 직후 5분 냉각 대기를 권고해요'},
'D-2':{name:'고빈도 팩교체형',r:5.0,rb:4.0,k:1.25,req:15,meas:6.23,abort:80.2,axes:'F3·D2·M3·L2·C1',risk:'팩별 사용 불균형',coach:'팩별 사이클 편차를 표시 · 교체 시점을 예고해요'},
'E-1':{name:'주말 집중형',r:2.42,rb:2.42,k:1.0,req:22,meas:3.01,abort:89.8,axes:'F2·D3·M2·L0·C3',risk:'주중 방전 방치 + 여유 시간 부족',coach:'예상 청소일 12시간 전 사전 충전을 알려드려요'},
'E-2':{name:'균등 분산형',r:2.34,rb:2.34,k:1.0,req:19,meas:2.69,abort:11.2,axes:'F2·D2·M2·L0·C2',risk:'특이 리스크 없음 (기준 그룹)',coach:'경고 없이 주간 요약·예상 수명만 표시해요'},
};

/* 페르소나 (가구 유형 A~E) — 말투/무드/기본조건 */
const P={
 A:{label:'1인 가구 (남성)',mood:'다크 · 하이테크',tone:'이름 + 반말',color:'#3a4756',name:'준우',models:['A-1','A-2'],
    area:7,baseLoad:[],  care:'귀찮음 극복 · 행동 넛지',
    msg:['{n}, 누워있지말고\n오늘은 청소하자.','{n}, 오늘은\n짧게나마 청소하자','{n}, 나를\n충전시켜줘,,'],
    voice:['오늘은 집 전체 다 끝낼 수 있어. 같이 시작하자!','배터리가 좀 빠듯한데, 거실만 먼저 할까?','나 거치대에서 잠깐 충전할게. 조금만 기다려줘!']},
 B:{label:'장모형 1인 가구 (여성)',mood:'파스텔 · 로즈골드',tone:'이름 + 제안형',color:'#c98a9b',name:'지영',models:['B-1','B-2'],
    area:10,baseLoad:['장모'], care:'저소음 · 머리카락',
    msg:['{n}, 오늘은\n청소 어때?','{n}, 저소음모드로\n청소 한바퀴 어때?','{n},\n배고파, 밥줘'],
    voice:['오늘 컨디션 좋아. 한 바퀴 돌고 올까?','조용히 거실만 먼저 정리할게.','배고파졌어. 밥 좀 줄래?']},
 C:{label:'영유아 가정',mood:'파스텔 · 키즈',tone:'보호자 존댓말',color:'#7bb3a0',name:'',models:['C-1','C-2'],
    area:24,baseLoad:[], care:'아이 건강 · 수면',
    msg:['우리 아이 건강을 위해\n청소 할 준비가 됐어요!','우리 아이 건강을 위해\n저소음 모드로 가볍게 어떨까요?','우리 아이 건강을 위해\n청소기 충전을 해주세요'],
    voice:['아이 방부터 깨끗하게 돌아볼게요.','낮잠 시간이라 저소음으로 조용히 할게요.','충전이 필요해요. 잠시 쉬었다 올게요.']},
 D:{label:'반려동물 가정',mood:'우드 · 코지',tone:'반려동물 화자',color:'#c79a63',name:'',models:['D-1','D-2'],
    area:20,baseLoad:['카펫','반려동물'], care:'털 · 소음 민감',
    msg:['우리아이\n털 청소할시간이에요','가볍게\n털 청소 어때요?','우리강아지를 위해\n배터리를 충전해주세요'],
    voice:['털 많은 곳부터 싹 치우고 올게요!','털이 제일 많은 구역만 집중해서 돌게요.','힘이 빠졌어요. 충전 좀 시켜주세요!']},
 E:{label:'일반 가정',mood:'뉴트럴 · 홈',tone:'가족 존댓말',color:'#7f8a93',name:'',models:['E-1','E-2'],
    area:28,baseLoad:[], care:'가족 생활 구역',
    msg:['주말동안 미룬 청소를\n가족과 함께 어때요?','가족을 위해서\n가볍게 청소 어때요?','미룬 청소를 위해\n충전해주세요'],
    voice:['주말이니까 집 전체 한 번 정리할게요.','가족들 많이 쓰는 곳부터 돌아볼게요.','충전하고 올게요. 곧 다시 시작할게요.']},
};

/* 아이돌 AI 보이스팩 — 실명 (※ 음성권 계약 전 예시) */
const VOICE={
 iu:{name:'아이유',tone:'감성적이고 따뜻한 톤',c:'#d06b86',emoji:'🎤'},
 jk:{name:'BTS 정국',tone:'부드럽고 감미로운 톤',c:'#6a63c9',emoji:'🎧'},
 hanni:{name:'뉴진스 하니',tone:'밝고 경쾌한 톤',c:'#e08a3a',emoji:'🐰'},
 wy:{name:'아이브 장원영',tone:'사랑스럽고 환한 톤',c:'#cf6bad',emoji:'💖'},
 ly:{name:'임영웅',tone:'편안하고 든든한 톤',c:'#4a86b0',emoji:'🎙️'},
};
const VORDER=['iu','jk','hanni','wy','ly'];

/* 부하 조건 → k (인수인계 4-1) */
const LOADS={'카펫':0.15,'반려동물':0.10,'장모':0.08};
function kOf(loads){let s=0;loads.forEach(l=>s+=LOADS[l]||0);return Math.min(1.40,1+s)}

/* 시간대 */
const TIMES=['아침','오후','저녁','심야'];

/* ── 3차 최종 보정식 (파라써블 시뮬레이션 결과보고 · 슬라이드 9) ────────
   r̄ = Σ(pᵢrᵢ)·k·(1+a_c·max(0,18−T)+a_h·max(0,T−30))·(1+β(1−SOC_mid/100)²) ÷ SOH
   T_avail = (SOC − SOC_res − c₀) / r̄          SOC_mid = (SOC + SOC_res)/2
   추정 계수: rᵢ 1.56·2.63·5.00 / β 0.237 / c₀ 2.14% / a_c 0.0056 · a_h 0.0012 */
const RES=5,C0=2.14,BETA=0.237,AC=0.0056,AH=0.0012,TEMP=22;
/* 모델별 base_r = Σ(pᵢ·rᵢ) — 결과보고 신(新) rᵢ 기준 */
const BASE={'A-1':2.416,'A-2':2.416,'B-1':4.289,'B-2':3.341,'C-1':1.881,'C-2':1.881,'D-1':4.052,'D-2':4.052,'E-1':2.523,'E-2':2.416};
function rbarAt(soc,base,k,soh){const m=(soc+RES)/2,tf=1+AC*Math.max(0,18-TEMP)+AH*Math.max(0,TEMP-30),
 sf=1+BETA*Math.pow(1-m/100,2);return base*k*tf*sf/(soh||1)}
function tAvail(soc,base,k,soh){return Math.max(0,(soc-RES-C0)/rbarAt(soc,base,k,soh))}
function endOf(soc,base,k,req,soh){return Math.max(RES,soc-C0-rbarAt(soc,base,k,soh)*req)}
function boundary(base,k,req,tg){let lo=RES,hi=100;
 for(let i=0;i<44;i++){const m=(lo+hi)/2;if(tAvail(m,base,k,1)-req>=tg)hi=m;else lo=m}return hi}
const vOf=m=>m>=5?0:(m>=0?1:2);
const josa=n=>!n?'':n+(((n.charCodeAt(n.length-1)-0xac00)%28)===0?'야':'아');
const VL=['완주 가능','빠듯함','충전 필요'],CC=['g','a','r'],ACC=['var(--g)','var(--a)','var(--r)'];
const $=id=>document.getElementById(id);

/* 평수 → 필요 청소시간 T_req (분) */
const reqFromArea=py=>Math.max(5,Math.round(py*0.82+2));
/* 모델 base_r · 사용자 k */
const baseOf=mid=>BASE[mid];

/* 구역 */
const ROOMS=[{n:'거실',i:'🛋️'},{n:'주방',i:'🍽️'},{n:'침실',i:'🛏️'},{n:'복도',i:'🚪'},{n:'현관',i:'🧹'}];

/* ══════════ 상태 ══════════ */
let W={step:1,model:null,sub:0,area:7,loads:[],time:'저녁',voice:null};
let SOC=100,phase='idle',elapsed=0,cleanReq=0,cleanBase=0,cleanK=1,cleanEco=false,timer=null,started=false;
const DTA=0.3;   /* 청소 애니메이션 분(min) 스텝 */
const mid=()=>P[W.model].models[W.sub];

/* ══════════ 위저드 ══════════ */
function renderWiz(){
 const bars=[1,2,3].map(i=>`<div class="s ${W.step===i?'on':W.step>i?'done':''}"></div>`).join('');
 let body='';
 if(W.step===1){
  body=`<div class="wtag">STEP 1 · 프로필</div>
   <div class="wtitle">우리 집은 어떤 유형인가요?</div>
   <div class="wsub">가구 유형에 따라 말투·화면·수명 코칭이 달라집니다. 하나를 선택하세요.</div>
   ${Object.entries(P).map(([k,p])=>`
    <div class="mcard ${W.model===k?'on':''}" onclick="pickModel('${k}')">
      <div class="mi" style="background:${p.color}">${k}</div>
      <div class="mt"><div class="a"><em>${k}</em>${p.label}</div><div class="b">${p.mood} · ${p.tone}</div></div>
      <div class="chk"></div></div>`).join('')}
   ${W.model?`<div class="subtog">${P[W.model].models.map((x,i)=>`
      <button class="${W.sub===i?'on':''}" onclick="W.sub=${i};renderWiz()"><b>${x} · ${M[x].name}</b><small>${M[x].axes}</small></button>`).join('')}</div>`:''}`;
 }
 else if(W.step===2){
  const p=P[W.model],req=reqFromArea(W.area),k=kOf(W.loads),base=baseOf(mid()),r=rbarAt(100,base,k,1);
  body=`<div class="wtag">STEP 2 · 사용 환경</div>
   <div class="wtitle">청소 조건을 설정하세요</div>
   <div class="wsub">같은 1인 가구라도 원룸인지 넓은 집인지에 따라 완주 판정이 달라집니다.</div>
   <div class="pfield">
     <div class="pl"><span>집 평수 · 청소 면적</span><span class="pv">${W.area}<small>평</small></span></div>
     <input type="range" min="5" max="45" step="1" value="${W.area}" oninput="W.area=+this.value;renderWiz()">
     <div class="ticks"><span>원룸 5평</span><span>25평</span><span>45평</span></div>
   </div>
   <div class="pfield">
     <div class="pl"><span>바닥·부하 조건</span><span class="pv" style="font-size:12px">k = ${k.toFixed(2)}</span></div>
     <div class="chips">${Object.keys(LOADS).map(l=>`
       <div class="chip-t ${W.loads.includes(l)?'on':''}" onclick="toggleLoad('${l}')">${l==='카펫'?'카펫·러그':l==='반려동물'?'반려동물 털':'장모 엉킴'} +${LOADS[l].toFixed(2)}</div>`).join('')}</div>
   </div>
   <div class="pfield">
     <div class="pl"><span>주 청소 시간대</span></div>
     <div class="seg">${TIMES.map(t=>`<button class="${W.time===t?'on':''}" onclick="W.time='${t}';renderWiz()">${t}</button>`).join('')}</div>
     ${(W.time==='심야'||(W.model==='C'&&W.time==='오후'))?`<div style="font-size:11px;color:#b5750f;font-weight:700;margin-top:8px">🔇 상황 인지 무음 — 이 시간대엔 음성을 끄고 앱 알림으로만 전달합니다.</div>`:''}
   </div>
   <div class="derived">
     <div class="d"><div class="k">필요 청소시간</div><div class="v">${req}<em>분</em></div></div>
     <div class="d"><div class="k">유효 소모율</div><div class="v">${r.toFixed(2)}<em>%/분</em></div></div>
     <div class="d"><div class="k">만충 가동</div><div class="v">${tAvail(100,base,k,1).toFixed(0)}<em>분</em></div></div>
   </div>`;
 }
 else if(W.step===3){
  body=`<div class="wtag">STEP 3 · 아이돌 AI 보이스팩</div>
   <div class="wtitle">누구 목소리로 들을까요?</div>
   <div class="wsub">판정은 그대로, 문장·억양만 좋아하는 목소리로 전달됩니다. (벤치마크: 아이돌 AI 통화 서비스)</div>
   ${VORDER.map(id=>{const v=VOICE[id];return `
     <div class="vcard ${W.voice===id?'on':''}" onclick="pickVoice('${id}')">
       <div class="av" style="background:${v.c}">${v.emoji}</div>
       <div class="vt"><div class="a">${v.name}</div><div class="b">${v.tone}</div></div>
       <div class="play" onclick="event.stopPropagation();preview('${id}')">▶</div></div>`}).join('')}
   <div class="vnote">※ 예시 대사는 보이스팩 설계용 샘플입니다. 실제 적용 시 <b>아티스트·소속사와의 음성권 계약</b>이 선행되어야 합니다.</div>`;
 }
 const canNext=(W.step===1&&W.model)||(W.step===2)||(W.step===3&&W.voice);
 const nextLabel=W.step===3?'설정 완료 · 코칭 시작':'다음';
 const nav=`<div class="wnav">
   ${W.step>1?`<button onclick="W.step--;renderWiz()">이전</button>`:''}
   <button class="next" ${canNext?'':'disabled'} onclick="wizNext()">${nextLabel}</button></div>`;
 $('wiz').innerHTML=`<div class="steps">${bars}</div>${body}${nav}`;
 renderDevice();
}
function pickModel(k){W.model=k;W.sub=0;const p=P[k];W.area=p.area;W.loads=[...p.baseLoad];renderWiz()}
function toggleLoad(l){const i=W.loads.indexOf(l);if(i<0)W.loads.push(l);else W.loads.splice(i,1);renderWiz()}
function pickVoice(id){W.voice=id;renderWiz()}
function preview(id){const v=VOICE[id];speak(`${v.name} 보이스 미리듣기 — "안녕! 오늘도 깨끗하게 시작해볼까?"`,false);toast(`▶ ${v.name} 보이스 미리듣기`)}
function wizNext(){
 if(W.step<3){W.step++;renderWiz();return}
 // 완료 → 동작 화면
 started=true;SOC=100;phase='idle';$('soc').value=100;
 $('wiz').style.display='none';$('op').classList.add('on');
 draw();toast('설정 완료 — 기기·스피커가 연결되었습니다');
}

/* ══════════ 동작 화면 ══════════ */
/* 4상태 판정 — 충전으로 해결(charge) vs 면적 문제로 한 번엔 불가(split) 구분 (인수인계 §8-3) */
const CIDX={ok:0,tight:1,charge:2,split:1};        // 화면 컬러 인덱스 (split=앰버)
const LBL ={ok:'완주 가능',tight:'빠듯함',charge:'충전 필요',split:'분할 청소'};
const MIDX={ok:0,tight:1,charge:2,split:1};         // 페르소나 문구 인덱스
function judge(){
 const base=baseOf(mid()),k=kOf(W.loads),req=reqFromArea(W.area);
 const tAv=tAvail(SOC,base,k,1),mg=tAv-req,end=endOf(SOC,base,k,req,1),r=rbarAt(SOC,base,k,1);
 const fullMg=tAvail(100,base,k,1)-req;              // 만충으로도 완주 가능한가
 let state;
 if(mg>=5)state='ok';
 else if(mg>=0)state='tight';
 else if(fullMg>=0)state='charge';                   // 충전하면 완주 가능
 else state='split';                                 // 한 번 충전으로 불가 → 분할 청소
 return {base,k,r,req,tAv,mg,end,fullMg,state,ci:CIDX[state],mi:MIDX[state]};
}
function ringSVG(pct){const R=50,C=2*Math.PI*R,off=C*(1-pct/100);
 return `<svg viewBox="0 0 116 116" width="112" height="112">
  <circle cx="58" cy="58" r="${R}" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="10"/>
  <circle cx="58" cy="58" r="${R}" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"
   stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 58 58)"/></svg>`}

function draw(){
 if(!started)return;
 const p=P[W.model],c=judge(),ci=c.ci,st=c.state,mi=c.mi;
 const muted=(W.time==='심야')||(W.model==='C'&&W.time==='오후');
 const grad=[`linear-gradient(150deg,#22a85e,#12894a)`,`linear-gradient(150deg,#dd961f,#c07914)`,`linear-gradient(150deg,#e3536b,#c53350)`][ci];
 const cov=(phase==='clean'||phase==='stranded')?Math.max(0,Math.min(1,elapsed/cleanReq)):(phase==='done'?1:Math.max(0,Math.min(1,c.tAv/Math.max(c.req,.1))));
 $('soc-v').textContent=SOC.toFixed(0)+'%';$('statbatt').textContent=SOC.toFixed(0)+'%';

 // 상태 배너
 let banner;
 if(phase==='clean') banner=`<span>🧹 청소 중 · ${cleanEco?'저소음':'표준'} 모드</span><span class="badge">${(cov*100).toFixed(0)}% 진행</span>`;
 else if(phase==='done') banner=`<span>✓ 청소 완료</span><span class="badge">거치대 복귀</span>`;
 else if(phase==='stranded') banner=`<span>⚠ 도중 방전 · 충전 필요</span><span class="badge">${(cov*100).toFixed(0)}% 지점</span>`;
 else if(phase==='charge') banner=`<span>⚡ 거치대 충전 중</span><span class="badge">${SOC.toFixed(0)}%</span>`;
 else banner=`<span>${p.label} · ${mid()} · ${W.area}평</span><span class="badge">실시간 예측</span>`;

 const line=p.msg[mi].replace('{n}',josa(p.name)).replace(/^,\s*/,'');
 $('op-hero').innerHTML=`<div class="hero" style="background:${grad}">
   <div class="htop">${banner}</div>
   <div class="ringrow">
     <div class="ring">${ringSVG(SOC)}<div class="pc"><b>${SOC.toFixed(0)}</b><span>${st==='charge'?'충전 필요':'배터리'}</span></div></div>
     <div class="hmsg"><div class="vd">${LBL[st]}</div><div class="ln">${line}</div></div>
   </div>
   <div class="hstat">
     <div class="c"><div class="k">예상 사용</div><div class="v">${c.tAv.toFixed(0)}<em>분</em></div></div>
     <div class="c"><div class="k">여유 margin</div><div class="v">${c.mg>=0?'+':''}${c.mg.toFixed(0)}<em>분</em></div></div>
     <div class="c"><div class="k">종료 잔량</div><div class="v">${c.mg>=0?c.end.toFixed(0)+'<em>%</em>':'—'}</div></div>
   </div></div>`;

 // 보이스 재생 바
 const vv=VOICE[W.voice];const spokenLine=p.voice[mi];
 $('op-voice').innerHTML=muted
  ? `<div class="voicebar muted"><div class="av" style="background:#3a4148">🔇</div>
      <div class="vinfo"><div class="nm">${vv.name} · 상황 인지 무음</div><div class="ln">앱 알림으로만 전달 — "${spokenLine}"</div></div></div>`
  : `<div class="voicebar"><div class="av" style="background:${vv.c}">${vv.emoji}</div>
      <div class="vinfo"><div class="nm">🎙 ${vv.name} 보이스로 재생 · ${vv.tone}</div><div class="ln">"${spokenLine}"</div></div>
      <div class="eq ${phase==='clean'?'spk':''}" id="op-eq"><i></i><i></i><i></i><i></i><i></i></div></div>`;

 // CTA
 let cta='';
 if(phase==='clean') cta=`<button class="big rd" onclick="stopClean()">■ 청소 중단</button>`;
 else if(phase==='charge') cta=`<button class="sub" onclick="stopCharge()">충전 중단</button>`;
 else if(st==='ok') cta=`<button class="big gr" onclick="startClean(false)">지금 청소 시작 · 전 구역</button>`;
 else if(st==='tight') cta=`<button class="big am" onclick="startClean(true)">저소음 모드로 우선 구역 청소</button>
    <button class="sub" onclick="startClean(false)">그래도 전 구역 청소 (완주 빠듯)</button>`;
 else if(st==='split') cta=`<button class="big am" onclick="startClean(false)">우선 구역부터 청소 (1차)</button>
    <button class="sub" onclick="startCharge()">충전 후 나머지 이어서 (분할 계획)</button>`;
 else cta=`<button class="big rd" onclick="startCharge()">⚡ 거치대에 올려 충전</button>`;
 $('op-cta').innerHTML=`<div class="cta">${cta}</div>`;

 // 우선 구역
 const recN=st==='ok'?ROOMS.length:st==='charge'?0:Math.ceil(ROOMS.length*0.5);
 const doneN=Math.floor(cov*recN);
 const zTag=st==='ok'?'전 구역':st==='charge'?'충전 우선':'핵심 '+recN+'구역';
 const zNote={ok:'배터리가 충분해 집 전체를 한 번에 끝낼 수 있어요.',
  tight:'완주가 빠듯해 생활 동선 중심 구역만 먼저 권장합니다.',
  charge:'지금 시작하면 도중에 멈출 수 있어요. 거치대 충전을 먼저 권장합니다.',
  split:`${W.area}평은 한 번 충전으로 완주하기 어려워요. 우선 구역부터 청소하고, 충전 후 나머지를 이어서 하는 <b>분할 청소</b>를 권장합니다.`}[st];
 $('op-zones').innerHTML=`<div class="card"><div class="ct">우선 청소 구역 <span class="tag ${CC[ci]}">${zTag}</span></div>
   <div class="zones">${ROOMS.map((z,i)=>{
     const cls=i>=recN?'skip':(i<doneN?'done':'rec');
     return `<div class="z ${cls}"><div class="zi">${z.i}</div><div class="zn">${z.n}</div></div>`}).join('')}</div>
   <div class="znote">${zNote}</div></div>`;

 // 수명 코칭
 const cAxis=M[mid()].axes.match(/C\d/)[0];
 const cText={C1:'상시 거치',C2:'사용 후 충전',C3:'방전 후 충전(자주 방치)'}[cAxis];
 $('op-coach').innerHTML=`<div class="coach"><div class="ch">💡 ${mid()} 맞춤 수명 코칭</div>
   <div class="cb">${M[mid()].coach}.<br><b>충전 습관</b> ${cText} · 핵심 리스크 — ${M[mid()].risk}</div></div>`;

 $('op-foot').innerHTML=`<div class="opfoot">
   <button onclick="reopen(2)">환경 바꾸기</button>
   <button onclick="reopen(3)">보이스 바꾸기</button></div>`;

 renderDevice();
 // 스피커 상태
 const spk=$('spk');spk.className='spk-unit'+(phase==='clean'&&!muted?' on':muted?' muted':'');
 $('spk-t').textContent=muted?'무음 (앱 알림)':phase==='clean'?`${vv.name} 재생 중`:`${vv.name} 대기`;
}

/* ── 기기 (스틱형 LCD) ── */
function renderDevice(){
 let ci=0,st='ok',socShow=SOC,mode='표준';
 if(started){const c=judge();ci=c.ci;st=c.state;mode=cleanEco?'저소음':(st==='tight'||st==='split'?'저소음 권장':'표준')}
 else if(W.model){const c=judge();ci=c.ci;st=c.state}
 const ac=['#3ecf82','#e0a341','#f0576c'][ci];
 $('lglow').style.background=[`radial-gradient(circle at 50% 42%,rgba(62,207,130,.20),transparent 62%)`,
   `radial-gradient(circle at 50% 42%,rgba(224,163,65,.18),transparent 62%)`,
   `radial-gradient(circle at 50% 42%,rgba(240,87,108,.18),transparent 62%)`][ci];
 $('lbrand').style.color='#cfd5db';
 $('lpct').style.color=ac;$('lpct').innerHTML=`${socShow.toFixed(0)}<small>%</small>`;
 $('lmode').style.color='#aab2ba';$('lmode').textContent=mode;
 $('lverd').style.color=ac;$('lverd').textContent=LBL[st];
 $('svled').style.background=ac;$('svled').style.opacity=(phase==='clean')?.95:.35;

 const stEl=$('devst'),tt=$('devst-t');stEl.className='dev-status';
 if(phase==='clean'){stEl.classList.add('run');tt.textContent=(cleanEco?'저소음':'표준')+' 청소 중'}
 else if(phase==='charge'){stEl.classList.add('chg');tt.textContent='거치대 충전 중 · '+SOC.toFixed(0)+'%'}
 else if(phase==='stranded'){stEl.classList.add('chg');tt.textContent='도중 방전 · 거치대 충전 필요'}
 else if(phase==='done'){tt.textContent='청소 완료 · 거치대 복귀'}
 else tt.textContent=st==='charge'?'충전 필요 · 거치대 대기':'거치대 대기 중';
}

/* ── 액션 ── */
function startClean(eco){
 const c=judge();cleanEco=eco;cleanReq=c.req;cleanBase=eco?c.base*0.78:c.base;cleanK=c.k;
 elapsed=0;phase='clean';SOC=Math.max(RES,SOC-C0);       // 기동 전력 c₀ 차감
 if(timer)clearInterval(timer);
 const vv=VOICE[W.voice];toast(`${eco?'저소음':'전 구역'} 청소 시작 — ${vv.name} 보이스 안내`);
 timer=setInterval(()=>{
  const step=rbarAt(SOC,cleanBase,cleanK,1)*DTA;         // 현재 잔량 기준 r̄ 로 방전
  SOC=Math.max(RES,SOC-step);elapsed+=DTA;$('soc').value=SOC.toFixed(0);
  if(SOC<=RES&&elapsed<cleanReq){phase='stranded';clearInterval(timer);timer=null;toast('⚠ 청소 도중 배터리 부족 — 거치대 충전');draw();return}
  if(elapsed>=cleanReq){phase='done';clearInterval(timer);timer=null;toast('✓ 청소 완주 완료');draw();return}
  draw();
 },80);
}
function stopClean(){if(timer)clearInterval(timer);timer=null;phase='idle';elapsed=0;toast('청소를 중단했습니다');draw()}
function startCharge(){phase='charge';if(timer)clearInterval(timer);toast('거치대 충전 시작');
 timer=setInterval(()=>{SOC=Math.min(100,SOC+1.1);$('soc').value=SOC.toFixed(0);
  if(SOC>=100){SOC=100;clearInterval(timer);timer=null;phase='idle';toast('✓ 충전 완료')}draw()},60)}
function stopCharge(){if(timer)clearInterval(timer);timer=null;phase='idle';draw()}
function reopen(step){phase='idle';if(timer)clearInterval(timer);timer=null;started=false;
 W.step=step;$('op').classList.remove('on');$('wiz').style.display='';renderWiz()}
function speak(t,mute){/* 데모용 no-op (실제는 TTS) */}

let tmo=null;
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(tmo);tmo=setTimeout(()=>el.classList.remove('show'),2200)}

/* ── 데모 컨트롤 ── */
$('soc').oninput=e=>{SOC=+e.target.value;if(phase==='clean'||phase==='charge')stopTimers();draw()};
function stopTimers(){if(timer)clearInterval(timer);timer=null;if(phase==='clean'||phase==='charge'||phase==='stranded'||phase==='done')phase='idle'}
$('reset').onclick=()=>{stopTimers();SOC=100;$('soc').value=100;draw();renderDevice()};
$('jump-ok').onclick=()=>{if(!started)return;stopTimers();const c=judge();
 if(c.fullMg<5){toast('이 조건은 만충으로도 여유 5분을 못 만들어요 — 분할 청소 대상');return}
 SOC=Math.round(boundary(c.base,c.k,c.req,5));$('soc').value=SOC;draw()};
$('jump-ti').onclick=()=>{if(!started)return;stopTimers();const c=judge();
 if(c.fullMg<0){toast('이 조건은 만충으로도 완주가 안 돼요 — 분할 청소 대상');return}
 SOC=Math.round(boundary(c.base,c.k,c.req,0));$('soc').value=SOC;draw()};
$('restart').onclick=()=>{location.reload()};

addEventListener('keydown',e=>{
 if(e.target.tagName==='INPUT'&&e.target.type==='text')return;
 if(e.key==='ArrowRight'){SOC=Math.min(100,SOC+2);$('soc').value=SOC;stopTimers();draw();renderDevice();e.preventDefault()}
 else if(e.key==='ArrowLeft'){SOC=Math.max(5,SOC-2);$('soc').value=SOC;stopTimers();draw();renderDevice();e.preventDefault()}
 else if(e.code==='Space'&&started){phase==='clean'?stopClean():startClean(judge().state==='tight');e.preventDefault()}
 else if(e.key.toLowerCase()==='r'){location.reload()}
});

/* 동작 화면 골격 */
$('op').innerHTML=`<div id="op-hero"></div><div id="op-voice"></div><div id="op-cta"></div>
 <div id="op-zones"></div><div id="op-coach"></div><div id="op-foot"></div>`;

renderWiz();
</script>
</body>
</html>
